[build]
  command = "npm run build"
  publish = "dist"

# Redirección para Single Page Application (React Router o navegación SPA)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Encabezados de caché para Service Worker de PWA
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
